# Yerel gelistirme icin sadece PostgreSQL veritabanini baslatir.
# Bu sayede localinizde Postgres kurulu olmasa bile Docker uzerinden veritabanini calistirabilirsiniz.
version: '3.8'

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: gulmetay-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gulmetay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cekicimater
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
    driver: local
