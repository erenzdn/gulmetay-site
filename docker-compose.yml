services:
  # --- PostgreSQL Veritabani ---
  postgres:
    image: postgres:16-alpine
    container_name: gulmetay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-gulmetay_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gulmetay-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-gulmetay_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend (Strapi CMS) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gulmetay-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_HOST=postgres
    volumes:
      - strapi-uploads:/app/public/uploads
    networks:
      - gulmetay-internal
      - nginx_internal
    depends_on:
      postgres:
        condition: service_healthy

  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_STRAPI_URL=https://gulmetay.mehmeterenozden.com
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    container_name: gulmetay-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - gulmetay-internal
      - nginx_internal
    depends_on:
      - backend

volumes:
  postgres-data:
    driver: local
  strapi-uploads:
    driver: local

networks:
  gulmetay-internal:
    driver: bridge
  nginx_internal:
    external: true
    name: nginx_internal
